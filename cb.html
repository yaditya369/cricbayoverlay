<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CricBay Layout 2 Footer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh} .overlay{position:fixed;left:0;right:0;bottom:var(--offset,0px);width:100%;border:1px solid #ffffff30;border-radius:9px;overflow:hidden;--alpha:.7}.top{height:70px;display:grid;grid-template-columns:clamp(68px,9%,116px) minmax(0,1fr) clamp(112px,16%,220px) minmax(0,1fr) clamp(68px,9%,116px);align-items:stretch;background:rgba(35,40,47,var(--alpha))}.identity{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 3px;min-width:0}.logo{height:33px;width:42px;object-fit:contain}.name{font-size:clamp(10px,1vw,14px);font-weight:800;text-align:center;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}.details{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:2px 7px;overflow:hidden}.player,.bowler-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;font-size:clamp(10px,1vw,14px);padding:2px 0}.player:first-child,.bowler-row{border-bottom:1px solid #bedafa70}.person{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stats{font-weight:700;white-space:nowrap}.scorebox{align-self:center;justify-self:center;width:calc(100% - 12px);height:48px;border:1px solid #ffffff33;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 5px}.score{font-size:clamp(20px,2.3vw,30px);font-weight:800;line-height:1}.meta{font-size:clamp(9px,1vw,12px);color:#ffffffc7;margin-top:2px;white-space:nowrap}.pp-marker{display:none;align-self:flex-start;margin-top:2px;padding:2px 7px;border-radius:4px;background:#ffd25a;color:#152335;font-size:10px;font-weight:900;letter-spacing:.4px;white-space:nowrap}.pp-marker.active{display:inline-flex}.pp-marker.bowling{background:#80ddf6;color:#102431}.balls{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;margin-top:2px}.ball-label{font-size:10px;font-weight:700;margin-right:2px;color:#c7d7e9}.ball{min-width:18px;height:18px;border:1px solid #bedafa99;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;font-size:11px}.ball.wicket{background:#d92f45;color:white}.ball.four{background:#e6bb5d;color:#17263a}.ball.six{background:#36a269;color:white}.bottom{height:25px;background:rgba(18,22,28,var(--alpha));border-top:1px solid #ffffff59;display:flex;align-items:center;justify-content:center;padding:2px 125px 2px 8px;position:relative;font-size:clamp(11px,1.25vw,16px);font-weight:800}.message{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 255px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.credit{position:absolute;right:10px;font-size:10px;font-weight:600;color:#c9d8ec;white-space:nowrap}.theme-blue .top{background:rgba(20,57,105,var(--alpha))}.theme-blue .bottom{background:rgba(12,39,77,var(--alpha))}.theme-red .top{background:rgba(138,12,24,var(--alpha))}.theme-red .bottom{background:rgba(67,6,15,var(--alpha))}@media(max-width:650px){.top{height:64px}.bottom{height:23px;padding-right:90px}.message{max-width:calc(100% - 135px);font-size:10px}.credit{right:5px;font-size:8px}.details{padding:1px 3px}.person,.stats{font-size:10px}.name{font-size:9px}.scorebox{height:42px}.ball-label{font-size:8px}.ball{font-size:9px;min-width:16px}.logo{width:30px;height:26px}}
.event-animation {position:fixed;left:50%;top:65%;transform:translate(-50%,-50%) scale(.7);z-index:1000;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:5px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.8));}
.event-animation.active {animation:score-event 2.4s ease-in-out both;}
.event-animation .event-emoji {font-size:clamp(45px,7vw,90px);}
.event-animation .event-text {font-size:clamp(32px,6vw,78px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #142640,0 6px 18px #000;}
.event-animation.wicket .event-text {color:#ff657b;}
.event-animation.four .event-text {color:#ffd36a;}
.event-animation.six .event-text {color:#71f6aa;}
@keyframes score-event {0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}15%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

/* Celebrations: layered burst, confetti, motion and a distinctive theme for each event */
.event-animation{top:58%;width:min(640px,92vw);height:260px;justify-content:center;isolation:isolate;}
.event-animation .event-rays{position:absolute;width:210px;height:210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.24) 0deg 8deg,transparent 8deg 24deg);opacity:0;z-index:-1;}
.event-animation .event-particles{position:absolute;inset:0;z-index:-1;}
.event-animation .particle{position:absolute;left:50%;top:48%;width:9px;height:15px;border-radius:2px;background:var(--particle,#ffd45b);opacity:0;}
.event-animation.active .particle{animation:particle-burst 1.4s cubic-bezier(.1,.6,.2,1) forwards;animation-delay:var(--delay);}
.event-animation.active .event-rays{animation:ray-burst 2s ease-out forwards;}
.event-animation .event-emoji{font-size:clamp(48px,7vw,85px);line-height:1;transform-origin:center;}
.event-animation .event-text{font-size:clamp(42px,7vw,88px);line-height:1;font-style:italic;letter-spacing:3px;-webkit-text-stroke:1px rgba(255,255,255,.45);}
.event-animation .event-subtitle{font-size:clamp(12px,1.7vw,19px);font-weight:900;letter-spacing:4px;text-shadow:0 3px 12px #000;}
.event-animation.wicket .event-text{color:#ff647e;text-shadow:0 0 22px #ff355b,0 4px 0 #74142d;}
.event-animation.four .event-text{color:#ffd456;text-shadow:0 0 25px #fba923,0 4px 0 #8e520a;}
.event-animation.six .event-text{color:#70f8c7;text-shadow:0 0 25px #00c9a5,0 4px 0 #09634e;}
.event-animation.wicket .event-emoji{animation:wicket-shake .7s ease-in-out 2;}
.event-animation.four .event-emoji{animation:four-slide 1.2s ease-out both;}
.event-animation.six .event-emoji{animation:six-launch 1.6s ease-out both;}
@keyframes particle-burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes ray-burst{0%{opacity:0;transform:scale(.2) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(2) rotate(60deg)}}
@keyframes wicket-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
@keyframes four-slide{0%{transform:translateX(-180px) rotate(-30deg);opacity:0}60%{transform:translateX(20px) rotate(10deg);opacity:1}100%{transform:translateX(0) rotate(0)}}
@keyframes six-launch{0%{transform:translateY(120px) scale(.4);opacity:0}55%{transform:translateY(-35px) scale(1.25);opacity:1}100%{transform:translateY(0) scale(1)}}

/* Keep celebration anchored to the WebView viewport, not the clipped scoreboard.
   The scoreboard itself retains its compact dimensions and bottom anchoring. */
#scoreEvent.event-animation {
  position: fixed !important;
  left: 50% !important;
  top: 50% !important;
  z-index: 2147483000 !important;
  pointer-events: none;
}



/* CricBay teams do not have logos: dedicate full identity panels to team names. */
.top{grid-template-columns:minmax(115px,17%) minmax(0,1fr) clamp(122px,17%,225px) minmax(0,1fr) minmax(115px,17%)}
.identity{padding:6px 10px;justify-content:center;min-width:0}
.identity:first-child{border-right:1px solid #ffffff26}
.identity:last-child{border-left:1px solid #ffffff26}
.name{font-size:clamp(13px,1.45vw,21px);line-height:1.15;letter-spacing:.15px;-webkit-line-clamp:2;overflow-wrap:break-word;width:100%}
@media(max-width:650px){.top{grid-template-columns:minmax(75px,18%) minmax(0,1fr) minmax(96px,18%) minmax(0,1fr) minmax(75px,18%)}.identity{padding:4px}.name{font-size:clamp(10px,2vw,13px)}}

/* Pre-match: retain both team names and show a centered VS panel. */
.overlay.pre-match .top{grid-template-columns:minmax(0,1fr) minmax(150px,30%) minmax(0,1fr)}
.overlay.pre-match .top>.details{display:none}
.overlay.pre-match .scorebox{grid-column:2;width:calc(100% - 12px)}
.overlay.pre-match .identity:last-child{grid-column:3}
.overlay.pre-match .score{font-size:clamp(17px,2.2vw,27px)}
@media(max-width:650px){.overlay.pre-match .top{grid-template-columns:minmax(0,1fr) minmax(76px,25%) minmax(0,1fr)}}
/* Match summary enabled by default; disable with summary=0. Innings-break summary remains disabled. */
.summary-panel{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);width:min(950px,94vw);max-height:80vh;overflow:auto;z-index:1500;background:rgba(17,25,39,.96);border:1px solid #7ba7d1;border-radius:14px;padding:20px 24px;box-shadow:0 14px 60px #000b;display:none;color:white}
.summary-panel.visible{display:block}.summary-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.summary-kicker{color:#93c5fd;font-size:12px;letter-spacing:1.5px;font-weight:800}.summary-title{font-size:26px;font-weight:900;margin:6px 0}.summary-result{color:#d8e9ff;font-size:15px;margin:5px 0 15px}.summary-scoreline{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.summary-scoreline span{background:#293b50;border-radius:7px;padding:9px 14px;font-weight:700}.summary-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.summary-col h3{color:#93c5fd;font-size:14px;letter-spacing:.6px;margin:0 0 9px}.summary-player{background:#243247;border-radius:7px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;font-size:14px}.summary-player span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.summary-player strong{white-space:nowrap}.summary-pom{margin-top:15px;font-weight:800;color:#ffe39b}.summary-credit{text-align:right;color:#aabed4;font-size:11px;margin-top:15px}@media(max-width:650px){.summary-panel{padding:12px;top:42%}.summary-title{font-size:20px}.summary-columns{gap:8px}.summary-player{padding:6px;font-size:11px}.summary-col h3{font-size:11px}}

/* Compact innings-break card; full match summary is unchanged. */
.summary-panel.innings-compact{width:min(510px,90vw);padding:13px 18px;top:43%;max-height:none}
.summary-panel.innings-compact .summary-title{font-size:20px;margin:2px 0 8px}
.summary-panel.innings-compact .summary-kicker,
.summary-panel.innings-compact .summary-result,
.summary-panel.innings-compact .summary-columns,
.summary-panel.innings-compact .summary-pom,
.summary-panel.innings-compact .summary-credit{display:none}
.summary-panel.innings-compact .summary-scoreline{margin:0;gap:0}
.summary-panel.innings-compact .summary-scoreline span{font-size:18px;padding:8px 12px;width:100%;text-align:center}

/* Landscape: keep the match card clear of the bottom score overlay. */
@media (orientation:landscape) and (max-height:700px){
 .summary-panel:not(.innings-compact){
   top:12px;bottom:calc(var(--offset,0px) + 112px);left:50%;
   transform:translateX(-50%);width:min(960px,91vw);max-height:none;
   padding:12px 18px;overflow-y:auto;overscroll-behavior:contain;
 }
 .summary-panel:not(.innings-compact) .summary-title{font-size:20px;margin:2px 0 4px}

 .summary-panel:not(.innings-compact) .summary-player{padding:5px 9px;margin:4px 0;font-size:12px}
 .summary-panel:not(.innings-compact) .summary-pom{margin-top:7px;font-size:13px}
 .summary-panel:not(.innings-compact) .summary-credit{display:none}
}

/* Marvel theme for summary panels: colors only, layout unchanged. */

/* Match summary is OUTSIDE #overlay: theme it directly, independently of the footer. */

#summaryPanel.theme-marvel-summary .summary-kicker,

/* CricClubs blue palette: distinct scoreboard, score panel and second bar. */
.overlay.theme-blue .top{background:rgba(20,57,105,var(--alpha))}
.overlay.theme-blue .scorebox{background:rgba(35,79,128,var(--alpha));border-color:#bedafa80}
.overlay.theme-blue .bottom{background:rgba(12,39,77,var(--alpha))}
/* Marvel also uses layered surfaces, never a flat single-color footer. */

.overlay.theme-marvel .scorebox{background:rgba(129,10,18,.85)}

/* Delivery badges: bold, centered, larger dot, and distinct extras. */
.ball{font-weight:800;text-align:center;flex-shrink:0}
.ball.dot{font-size:18px;font-weight:900;line-height:1}
.ball.extra{background:#4d7dcb;color:#fff;border-color:#c7ddff;font-weight:900}

.theme-blue .ball.extra{background:#80d8ff;color:#092746;border-color:#80d8ff}

async function fetchWorkerJSON(path,validate,timeoutMs=8000){

  const base=workerPool[index];
  const controller=new AbortController();

   const response=await fetch(`${base}${path}`,{cache:'no-store',signal:controller.signal});
   if(!response.ok)throw Error(`HTTP ${response.status}`);

   if(!validate(data))throw Error('Invalid API JSON');
   if(index!==activeWorkerIndex){

    activeWorkerIndex=index;
   }
   return data;
  }catch(error){
   lastError=error;
   console.warn('CricBay Worker request failed:',base,path,error.message);
  }finally{clearTimeout(timeout);}
 }

}

const interval=Math.max(1,Math.min(60,Number.isFinite(refreshSeconds)?refreshSeconds:10))*1000;
const theme=['graphite','blue','red','marvel','stadium'].includes(q.get('theme'))?q.get('theme'):'marvel';

// The independent summary panel uses the same theme as the scoreboard.
$('summaryPanel').className='summary-panel theme-'+theme;
const opacity=q.has('transparency')?1-Number(q.get('transparency'))/100:Number(q.get('opacity')??'.85');
overlay.style.setProperty('--alpha',Math.max(0,Math.min(1,Number.isFinite(opacity)?opacity:.85)));
$('summaryPanel').style.setProperty('--alpha',Math.max(0,Math.min(1,Number.isFinite(opacity)?opacity:.85)));

const playerPreviewMode=/^\d+$/.test(previewPlayerId)&&['batting','bowling'].includes(previewRole);

const profilePath=q.get('profilePath')||'/player/profile/{id}';

const safePath=path=>/^\/[\w/{}?=&.-]+$/.test(path)&&!path.startsWith('//');
async function playerWorkerRequest(path,method='GET',payload=null){
 if(!safePath(path))throw Error('Invalid player API path');
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);
 try{
  const response=await fetch(playerApiWorker+path,{
   method,
   headers:payload?{...proxyHeaders,'Content-Type':'application/json'}:proxyHeaders,
   body:payload?JSON.stringify(payload):undefined,
   signal:ctrl.signal,
   cache:'no-store'
  });

  return await response.json();

}
function unwrapPlayerResult(response){
 let value=response;
 for(let i=0;i<3;i++){
  if(!value||typeof value!=='object'||Array.isArray(value))break;
  const next=value.data??value.result??value.response;
  if(next==null||next===value)break;
  value=next;

}
function profileStatObject(response,role){

 const item=Array.isArray(root)?root[0]:root;
 if(!item||typeof item!=='object')return {};
 const aliases=role==='batting'?['batting_statistics','batting_stats','batting','battingStatistics']:['bowling_statistics','bowling_stats','bowling','bowlingStatistics'];
 for(const name of aliases){if(item[name]&&typeof item[name]==='object')return item[name];}
 return item;
}
function statValue(obj,keys){
 if(!obj||typeof obj!=='object')return null;
 for(const key of keys){const v=obj[key];if(v!==undefined&&v!==null&&v!==''&&typeof v!=='object')return String(v);}

}
function profileFields(obj,role){
 const defs=role==='batting'?
  [['MATCHES',['matches','matches_played','total_matches','games_played']],['RUNS',['runs','total_runs','runs_scored']],['AVERAGE',['average','batting_average','avg']],['STRIKE RATE',['strike_rate','batting_strike_rate','sr']],['50s',['fifties','fifty','half_centuries']],['100s',['hundreds','centuries']]]:
  [['MATCHES',['matches','matches_played','total_matches','games_played']],['WICKETS',['wickets','total_wickets','wickets_taken']],['ECONOMY',['economy','economy_rate','eco']],['AVERAGE',['average','bowling_average','avg']],['BEST',['best_bowling','best_figures','best']]];

// Resolve once per HTML load, including when the match snapshot is not ready yet.
function parseTournamentDay(value){
 if(value==null)return null;
 const s=String(value).trim();
 let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return Number(m[1])*10000+Number(m[2])*100+Number(m[3]);
 m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
 if(m)return Number(m[3])*10000+Number(m[1])*100+Number(m[2]);

}
function tournamentRows(response){
 const root=unwrapPlayerResult(response);
 if(Array.isArray(root))return root;
 for(const field of ['tournaments','results','items','list','records']){
  if(Array.isArray(root?.[field]))return root[field];
  if(Array.isArray(root?.data?.[field]))return root.data[field];

}
function loadTournamentListOnce(){
 // One shared promise for this page lifetime; successful results are never refetched.

   console.warn('CricBay tournament list unavailable:',e);

}
function chooseCurrentTournament(rows){
 const now=new Date();

  const start=parseTournamentDay(t.start_date??t.startDate);
  const end=parseTournamentDay(t.end_date??t.endDate);
  return start!==null&&end!==null&&start<=today&&today<=end;
 });
 if(!active.length)return null;
 const match=tournamentMatchContext||{};
 const matchId=String(match.tournament_id??match.tournament?.id??'');
 const exact=active.find(t=>String(t.tournament_id??t.id)===matchId);
 if(exact)return exact;
 if(active.length===1)return active[0];
 const matchName=String(match.tournament_name??'').trim().toLowerCase();
 const byName=matchName?active.find(t=>String(t.tournament_name??t.name??'').trim().toLowerCase()===matchName):null;

}

// Fire the single tournament-list call on page load, independently of player preloading.

function tournamentStatsObject(response,role,tournamentId){

async function loadProfileStats(item){

function isInningsComplete(data,index){return matchInningsInfo(data,index).finished;}
function matchOutcome(data){
 const sp=superOverPhase(data);
 if(sp)return sp.result?{complete:true,result:sp.result,source:'superover'}:{complete:false,result:'',source:'superover-pending'};
 const official=officialResult(data);
 if(official)return {complete:true,result:official,source:'official'};
 const a=matchInningsInfo(data,1),b=matchInningsInfo(data,2);
 if(!a.started||!a.finished||!b.started)return {complete:false,result:'',source:'innings-not-finished'};
 const target=adjustedTarget(data);
 const normalTarget=Number.isFinite(a.runs)?a.runs+1:null;
 const chaseTarget=target??normalTarget;
 // Reduced-overs / DLS outcomes require the revised target or an official result.
 const m=data.match||{};
 const reduced=/dls|duckworth|rain|reduc|interrupt|abandon/i.test(String(m.match_status||'')+' '+String(m.status_detail||'')+' '+String(m.remarks||''));
 if(reduced&&target==null)return {complete:false,result:'',source:'adjusted-target-pending'};
 if(!Number.isFinite(a.runs)||!Number.isFinite(b.runs))return {complete:false,result:'',source:'scores-pending'};
 const firstName=a.inn.team?.team_name||a.inn.team?.short_name||a.inn.scorecard?.team_name||'First innings team';
 const secondName=b.inn.team?.team_name||b.inn.team?.short_name||b.inn.scorecard?.team_name||'Second innings team';
 const targetReached=Number.isFinite(chaseTarget)&&b.runs>=chaseTarget;
 if(!targetReached&&!b.finished)return {complete:false,result:'',source:'second-innings-in-progress'};
 if(targetReached){

   const margin=Math.max(0,b.wicketLimit-b.wickets);
   return {complete:true,result:`${secondName} won by ${margin} wicket${margin===1?'':'s'}`,source:'chase'};
  }

 }
 if(reduced||target!=null)return {complete:false,result:'',source:'adjusted-result-pending'};
 if(a.runs===b.runs)return {complete:true,result:'Match tied',source:'tie'};

function isMatchComplete(data){return matchOutcome(data).complete;}
function getMatchResult(data){return matchOutcome(data).result;}
function chaseContext(data){
 const a=matchInningsInfo(data,1),b=matchInningsInfo(data,2),m=data.match||{};
 const second=b.started&&(m.current_inning_id==null||String(m.current_inning_id)===String(b.inn.inning_id));
 const target=adjustedTarget(data)??(Number.isFinite(a.runs)?a.runs+1:null);

function matchFooter(data){return getMatchResult(data);}
// Summary uses full scorecards embedded in the snapshot, not just current players.
// A scorecard fetch is optional and occurs only for completed matches (POM/result).
let summaryScorecard=null, scorecardLastAttempt=0, scorecardPending=null, latestSnapshot=null;
// Scorecard requests are deduplicated and never hold up live-score polling.
async function fetchScorecardOnce(){
 if(pollingStoppedForPom)return;
 if(scorecardPending)return scorecardPending;
 scorecardLastAttempt=Date.now();
 scorecardPending=(async()=>{
  try{
   summaryScorecard=await fetchWorkerJSON(`/scorecard/${matchId}`,data=>data!==null&&typeof data==='object'&&!Array.isArray(data)&&!data.error);
  }catch(e){console.warn('Scorecard fetch failed:',e);}
  finally{scorecardPending=null;}
 })();
 return scorecardPending;
}
const statNum=v=>Number.isFinite(Number(v))?Number(v):0;
function inningsState(x){return String(x?.status||'').trim().toLowerCase();}
function getMatchPhase(data){
 if(isMatchComplete(data))return 'match';
 if(superOverPhase(data))return '';
 if(firstInningsFinished(data)&&!secondInningsStarted(data))return 'innings';
 return '';
}
function getInningsStats(inn){
 const sc=inn?.scorecard||{};
 return {batters:Array.isArray(sc.batter_details)?sc.batter_details:[],bowlers:Array.isArray(sc.bowling_figures)?sc.bowling_figures:[]};
}
function scorecardStats(sc){
 const h=sc?.home_team_batter||{},a=sc?.away_team_batter||{};
 return {batters:[...(h.home_batter||[]),...(a.away_batter||[])],bowlers:[...(h.home_bowling_figures||[]),...(a.away_bowling_figures||[])]};
}
function summaryRows(id,people,kind){
 const el=$(id);el.replaceChildren();
 if(!people.length){const empty=document.createElement('div');empty.className='summary-player';empty.textContent='Statistics not available yet';el.append(empty);return;}
 for(const [index,p] of people.slice(0,3).entries()){
  const row=document.createElement('div');row.className='summary-player';
  const name=document.createElement('span');name.textContent=`${index+1}. ${p.batter_name||p.bowler_name||p.player_name||fullName(p)}`;
  const stats=document.createElement('strong');
  const dismissal=String(p.dismissal??p.dismissal_type??p.how_out??'').trim();
  const isNotOut=kind==='bat' && (/^not[\s-]*out$/i.test(dismissal)||p.is_not_out===true||p.isNotOut===true||String(p.batting_status??'').toLowerCase()==='not out');
  stats.textContent=kind==='bat'?`${statNum(p.runs)}${isNotOut?'*':''} (${statNum(p.balls_faced??p.balls)})`:`${statNum(p.wickets)}/${statNum(p.runs)} (${p.overs??'0.0'})`;
  row.append(name,stats);el.append(row);
 }
}
function bowlingFigures(p){
 // Shared with live lower-third. CricBay reports overs in cricket notation (3.2 = 3 overs + 2 balls).
 return `${p.wickets??0}/${p.runs??0} (${p.overs??p.overs_bowled??p.bowling_overs??'0.0'})`;
}
function broadcastRows(id,people,kind){
 const el=$(id);el.replaceChildren();
 const ranked=people.slice().sort((a,b)=>kind==='bat'?(statNum(b.runs)-statNum(a.runs)||statNum(a.balls_faced??a.balls)-statNum(b.balls_faced??b.balls)):(statNum(b.wickets)-statNum(a.wickets)||statNum(a.runs)-statNum(b.runs))).slice(0,2);
 if(!ranked.length){const row=document.createElement('div');row.className='broadcast-empty';row.textContent='Stats pending';el.append(row);return;}
 for(const p of ranked){const row=document.createElement('div');row.className='broadcast-statrow';const name=document.createElement('span');name.textContent=p.batter_name||p.bowler_name||p.player_name||fullName(p);const stats=document.createElement('strong');const dismissal=String(p.dismissal??p.dismissal_type??p.how_out??'').trim();const notOut=kind==='bat'&&(/^not[\s-]*out$/i.test(dismissal)||p.is_not_out===true||p.isNotOut===true||String(p.batting_status??'').toLowerCase()==='not out');stats.textContent=kind==='bat'?`${statNum(p.runs)}${notOut?'*':''} (${statNum(p.balls_faced??p.balls)})`:bowlingFigures(p);row.append(name,stats);el.append(row);}
}
function renderBroadcastSummary(data){
 const i1=data.innings?.inning1||{},i2=data.innings?.inning2||{},m=data.match||{};
 const teamName=i=>i.team?.team_name||i.scorecard?.team_name||'Team';
 const normalizeName=x=>String(x||'').trim().toLowerCase();
 const sc=summaryScorecard;
 const scorecardFor=inn=>{
  if(!sc)return null;
  const name=normalizeName(teamName(inn));
  if(name&&name===normalizeName(sc.home_team_name))return 'home';
  if(name&&name===normalizeName(sc.away_team_name))return 'away';
  const id=inn.team?.team_id??inn.scorecard?.team_id;
  if(id!=null&&String(id)===String(sc.home_team_id))return 'home';
  if(id!=null&&String(id)===String(sc.away_team_id))return 'away';
  return null;
 };
 const innings=[i1,i2];
 innings.forEach((inn,idx)=>{
  const n=idx+1,other=innings[1-idx],own=getInningsStats(inn),opp=getInningsStats(other);
  const side=scorecardFor(inn);
  const bat=own.batters.length?own.batters:(side==='home'?sc?.home_team_batter?.home_batter:side==='away'?sc?.away_team_batter?.away_batter:[])||[];
  // Bowling figures in an innings belong to the *fielding* team, not the batting team.
  const bowl=opp.bowlers.length?opp.bowlers:(side==='home'?sc?.away_team_batter?.away_bowling_figures:side==='away'?sc?.home_team_batter?.home_bowling_figures:[])||[];
  const name=teamName(inn);set('broadcastName'+n,name);
  const total=inn.scorecard?.total||{};
  set('broadcastScore'+n,`${inn.score??total.total_runs??0}/${inn.wickets??total.total_wickets??0}`);
  set('broadcastOvers'+n,`${scoreOver(inn.overs??total.total_overs??'0.0')} OVERS`);
  broadcastRows('broadcastBat'+n,bat,'bat');broadcastRows('broadcastBowl'+n,bowl,'bowl');
 });
 // One outcome function controls both match detection and displayed result.
 const result=getMatchResult(data);
 set('broadcastMargin',result||'Result pending');
 const pom=String(sc?.pom_name||sc?.player_of_match?.name||sc?.player_of_match||m.pom_name||m.player_of_match?.name||m.player_of_match||'').trim();

function renderSummary(data,phase){
 const panel=$('summaryPanel');
 if(phase!=='match'){panel.classList.remove('visible','broadcast-active');document.body.classList.remove('broadcast-match-visible');return;}

 const m=data.match||{},i1=data.innings?.inning1||{},i2=data.innings?.inning2||{};

 panel.classList.toggle('innings-compact',!isMatch);
 set('summaryTitle',isMatch?'Match Complete':'Innings Break');
 const result=isMatch?(matchFooter(data)||'Awaiting official result'):'';
 set('summaryResult',result);
 const scores=$('summaryScores');scores.replaceChildren();
 for(const inn of (isMatch?[i1,i2]:[i1])){
  const name=inn.team?.team_name||inn.scorecard?.team_name||'Team';
  const total=inn.scorecard?.total||{};
  const score=inn.score??total.total_runs;
  if(score==null)continue;
  const item=document.createElement('span');item.textContent=`${name}: ${score}/${inn.wickets??total.total_wickets??0} (${inn.overs??total.total_overs??'0.0'})`;scores.append(item);
 }
 let batters=[],bowlers=[];
 if(isMatch){
  const first=getInningsStats(i1),second=getInningsStats(i2);
  batters=[...first.batters,...second.batters];bowlers=[...first.bowlers,...second.bowlers];
  if(summaryScorecard){
   const fallback=scorecardStats(summaryScorecard);
   if(!batters.length)batters=fallback.batters;
   if(!bowlers.length)bowlers=fallback.bowlers;
  }
 }else ({batters,bowlers}=getInningsStats(i1));
 batters.sort((a,b)=>statNum(b.runs)-statNum(a.runs)||statNum(a.balls_faced??a.balls)-statNum(b.balls_faced??b.balls));

 summaryRows('summaryBatters',batters,'bat');summaryRows('summaryBowlers',bowlers,'bowl');
 const pom=summaryScorecard?.pom_name||summaryScorecard?.player_of_match?.name||m.pom_name||m.player_of_match?.name||'';

// Lifecycle callbacks: transition-only, with the first successful snapshot as baseline.
// A page opened mid-match must never replay historical lifecycle events.
const lifecycleEmitted=new Set();
let lifecyclePrevious=null;
function currentPom(data){

 // Empty values must not mask a valid POM from the other response.
 const candidates=[sc.pom_name,sc.player_of_match?.name,sc.player_of_match,
   m.pom_name,m.player_of_match?.name,m.player_of_match];
 for(const candidate of candidates){
  const name=typeof candidate==='string'?candidate.trim():'';
  if(name&&name!=='[object Object]'&&name.toLowerCase()!=='null')return name;
 }
 return '';
}
function emitLifecycle(type,data,extra={}){
 if(lifecycleEmitted.has(type))return;
 const payload={type,matchId:String(matchId),timestamp:Date.now(),...extra};
 let delivered=false;
 try{
  const bridge=window.AndroidBridge;
  if(bridge&&typeof bridge.onMatchEvent==='function'){
   bridge.onMatchEvent(JSON.stringify(payload));
   delivered=true;
  }
  // Browser consumers can subscribe without an Android bridge.
  if(window.dispatchEvent(new CustomEvent('cricbay:match-event',{detail:payload})))delivered=true;

}
function lifecycleState(data){
 const sp=superOverPhase(data);

  first: first&&!second&&!sp&&phase!=='match',
  break: phase==='innings'&&!second&&!sp,
  second: second&&!sp&&phase!=='match',
  super: Boolean(sp),
  superNumber:sp?.number??1,
  ended:phase==='match',
  pom:phase==='match'?currentPom(data):''

function checkLifecycle(data){
 const next=lifecycleState(data);

 if(!prev.first&&!prev.break&&!prev.second&&!prev.super&&!prev.ended&&next.first)
  emitLifecycle('FIRST_INNINGS_STARTED',data,{innings:1});

  emitLifecycle('INNINGS_BREAK',data,{innings:1});
 if(!prev.second&&!prev.super&&!prev.ended&&next.second)
  emitLifecycle('SECOND_INNINGS_STARTED',data,{innings:2});

  emitLifecycle('SUPER_OVER_STARTED',data,{superOverNumber:next.superNumber});

  emitLifecycle('MATCH_ENDED',data,{result:getMatchResult(data)||''});

function updateSummary(data){

 if(!pollingStoppedForPom&&!currentPom(data)&&actualPhase==='match'&&Date.now()-scorecardLastAttempt>=60000&&
    (!officialResult(data)||((summaryEnabled||summaryPreview)&&(!summaryScorecard||!String(summaryScorecard.pom_name||summaryScorecard.player_of_match?.name||summaryScorecard.player_of_match||data.match?.pom_name||'').trim())))){
  void fetchScorecardOnce().then(()=>{
   // Apply asynchronous results to the newest snapshot, never a stale poll.
   const currentData=latestSnapshot||data;
   const footer=matchFooter(currentData);
   if(footer)set('message',footer);
   if(summaryEnabled||summaryPreview)renderSummary(currentData,summaryPreview||getMatchPhase(currentData));
   checkLifecycle(currentData);
   stopPollingWhenPomSelected(currentData);
  });
 }
 if(!summaryEnabled&&!summaryPreview){$('summaryPanel').classList.remove('visible','broadcast-active');document.body.classList.remove('broadcast-match-visible');return;}
 renderSummary(data,previewPhase==='match'?'match':'');
}

let refreshTimer=null;
let pollingStoppedForPom=false;
function stopPollingWhenPomSelected(data){
 if(pollingStoppedForPom||!currentPom(data))return;
 pollingStoppedForPom=true;
 if(refreshTimer!==null){clearInterval(refreshTimer);refreshTimer=null;}
 console.info("CricBay: Player of the Match selected; snapshot polling stopped.");
}
async function refresh(){if(busy||pollingStoppedForPom)return;busy=true;try{
 if(!/^\d+$/.test(matchId))throw Error('matchId must be numeric');
 const data=await fetchWorkerJSON(`/live/snapshot/${matchId}`,data=>Boolean(data&&typeof data==='object'&&data.match));
 document.body.classList.toggle('cricbay-superover',Boolean(superOverPhase(data)));
 restoreAfterScoreSuccess();
 latestSnapshot=data;render(data);preloadAllPlayers(data);trackProfiles(data);lastVersion=data.version;
 updateSummary(data);
 checkLifecycle(data);
 stopPollingWhenPomSelected(data);
 }catch(e){
 console.error('CricBay overlay:',e);
 failedScoreFetches++;
 if(failedScoreFetches>=3)hideForScoreFailure();

}finally{busy=false;}}
// Explicit player-profile preview: no wait for a wicket, over, toss or player change.
// Uses the same worker, shared cache and three API calls as live player introductions.
async function startPlayerProfilePreview(){
 if(!playerPreviewMode)return;

   snapshot:{},team:'',inning:'preview'};

 console.info('CricBay profile preview: fetching',previewPlayerId,previewRole);

  const data=await fetchMissingPlayerApis(item);

void startPlayerProfilePreview();
window.showCricBayEvent=showEvent;
// Browser/WebView audio policies require a genuine gesture before sound playback.
// Do not attempt a muted play/pause: that does not reliably unlock unmuted audio.
if(soundEnabled){
 const unlockAudio=()=>{
   if(audioUnlocked)return;
   boundaryAudio.muted=false;
   const attempt=boundaryAudio.play();
   if(attempt&&typeof attempt.then==='function'){
     attempt.then(()=>{audioUnlocked=true;boundaryAudio.pause();boundaryAudio.currentTime=0;})
       .catch(e=>console.warn('Audio unlock failed:',e));
   }
 };
 document.addEventListener('pointerdown',unlockAudio,{once:true});
 document.addEventListener('touchend',unlockAudio,{once:true});
}
const highlight=(q.get('highlight')||'').toLowerCase();if(['four','six','wicket'].includes(highlight))setTimeout(()=>showEvent(highlight),500);
refresh();if(!pollingStoppedForPom)refreshTimer=setInterval(refresh,interval);
})();
