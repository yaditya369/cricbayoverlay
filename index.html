<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CricBay Live Score Overlay</title>
<style>
:root{--overlay-opacity:.70;--panel:rgba(24,27,31,var(--overlay-opacity));--white:#fff;--muted:#c5cbd2}*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.overlay{display:inline-block;min-width:370px;max-width:560px;background:var(--panel);border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.22)}.top{display:flex;align-items:center;gap:10px;padding:8px 12px 6px}.teams{min-width:0;flex:1}.team-name{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:25px;line-height:1.08;font-weight:800;letter-spacing:-.4px;white-space:nowrap}.overs{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}.status{align-self:flex-start;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:3px 6px;font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff}.divider{height:1px;background:rgba(255,255,255,.16)}.players{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:6px 12px 7px}.player{min-width:0;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player strong{font-weight:700}.player span{color:var(--muted)}.bottom{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(0,0,0,.18);font-size:10px;color:var(--muted)}.balls{color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.error{font-size:11px;color:#ffd7d7;padding:7px 12px;display:none;max-width:520px}@media(max-width:420px){.overlay{min-width:320px}.score{font-size:22px}.top{padding:7px 9px 5px}.players{padding:5px 9px}.bottom{padding:5px 9px}}
</style></head><body>
<div class="overlay"><div class="top"><div class="teams"><div class="team-name" id="team">CRICBAY LIVE</div><div class="score" id="score">--/--</div><div class="overs"><span id="overs">Overs --</span> <span id="rr">· RR --</span></div></div><div class="status" id="status">LIVE</div></div><div class="divider"></div><div class="players"><div class="player" id="bat1">Bat 1: --</div><div class="player" id="bat2">Bat 2: --</div><div class="player" id="bowl1">Bowler: --</div><div class="player" id="bowl2">Bowler 2: --</div></div><div class="bottom"><span id="inning">Innings --</span><span class="balls" id="balls">Balls: --</span></div><div class="error" id="error"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script><script>
(()=>{const p=new URLSearchParams(location.search),matchId=p.get('matchId')||'31552',op=Number(p.get('opacity')),opacity=p.has('opacity')&&Number.isFinite(op)?Math.min(1,Math.max(.1,op)):.70,raw=parseInt(p.get('refresh')||'5000',10),refresh=Number.isFinite(raw)?Math.min(30000,Math.max(2000,raw)):5000;document.documentElement.style.setProperty('--overlay-opacity',opacity);
const KEY=CryptoJS.enc.Utf8.parse('m4WECzfzB6zXNaIslLP3Zw=='),IV=CryptoJS.enc.Utf8.parse('whsbdhgntkgngmhk'),$=id=>document.getElementById(id),safe=v=>v===null||v===undefined||v===''?'--':String(v),num=v=>Number(v||0);
async function getJson(url){const r=await fetch(url,{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error(`HTTP ${r.status}`);const data=await r.json();if(typeof data.resp_text==='string'){const bytes=CryptoJS.AES.decrypt(data.resp_text,KEY,{iv:IV,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7}),plain=bytes.toString(CryptoJS.enc.Utf8);if(!plain)throw Error('Unable to decrypt response');return JSON.parse(plain)}return data}
function fmtOvers(v){if(v===undefined||v===null)return'--';const n=Number(v);return Number.isFinite(n)?`${Math.floor(n)}.${Math.round((n-Math.floor(n))*10)}`:String(v)}
function ballLabel(b){if(b.commentary_only)return'';if(b.wicket_ball)return'W';if(num(b.wide_ball)>0)return`${num(b.wide_ball)}wd`;if(num(b.noball)>0)return`${num(b.noball)}nb`;return safe(b.runs)}
function render(inn,data){const list=Array.isArray(data.over_details_list)?data.over_details_list:[];if(!list.length)throw Error('No over details in response');const cur=list.find(o=>o.over_completed===false)||list[0],snap=list.find(o=>o.total_score!==undefined&&o.total_wickets!==undefined)||cur;let score=snap.total_score,wickets=snap.total_wickets,overs=cur.over_number??snap.over_number;
if((score===undefined||wickets===undefined)&&cur!==snap){const base=list.find(o=>o!==cur&&o.total_score!==undefined&&o.total_wickets!==undefined);if(base){score=num(base.total_score);wickets=num(base.total_wickets);for(const b of(cur.over_ball_details||[])){if(b.commentary_only)continue;score+=num(b.runs)+num(b.wide_ball)+num(b.noball)+num(b.byes)+num(b.legbyes)+num(b.penalty_runs);if(b.wicket_ball)wickets++}}}
$('team').textContent=cur.team_name||snap.team_name||inn.inning_name||'CRICBAY LIVE';$('score').textContent=`${safe(score)}/${safe(wickets)}`;$('overs').textContent=`Overs ${fmtOvers(overs)}`;$('rr').textContent=`· RR ${safe(cur.current_rr??snap.current_rr)}`;$('status').textContent=cur.over_completed===false?'LIVE':'SCORE';$('inning').textContent=`Innings: ${safe(inn.inning_name)}`;
const b1=cur.batter1_name!==undefined?cur:snap,b2=cur.batter2_name!==undefined?cur:snap;$('bat1').innerHTML=`<strong>${safe(b1.batter1_name)}</strong> <span>${safe(b1.batter1_runs)} (${safe(b1.batter1_balls)})</span>`;$('bat2').innerHTML=`<strong>${safe(b2.batter2_name)}</strong> <span>${safe(b2.batter2_runs)} (${safe(b2.batter2_balls)})</span>`;$('bowl1').innerHTML=`<strong>${safe(cur.current_bowler_name||snap.current_bowler_name||cur.bowler1_name||snap.bowler1_name)}</strong> <span>${safe(cur.bowler1_overs??snap.bowler1_overs)}-${safe(cur.bowler1_maidens??snap.bowler1_maidens)}-${safe(cur.bowler1_runs??snap.bowler1_runs)}-${safe(cur.bowler1_wickets??snap.bowler1_wickets)}</span>`;$('bowl2').innerHTML=`<strong>${safe(snap.bowler2_name)}</strong> <span>${safe(snap.bowler2_overs)}-${safe(snap.bowler2_maidens)}-${safe(snap.bowler2_runs)}-${safe(snap.bowler2_wickets)}</span>`;const balls=(cur.over_ball_details||[]).filter(b=>!b.commentary_only).slice(-6).map(ballLabel).filter(Boolean);$('balls').textContent=`Balls: ${balls.length?balls.join(' · '):'--'}`;$('error').style.display='none'}
async function update(){try{$('status').textContent='UPDATING';const snapshot=await getJson(`https://www.cricbay.com/server/api/livescore/audience/snapshot/${encodeURIComponent(matchId)}/`),innings=Array.isArray(snapshot)?snapshot:(snapshot.innings||snapshot.inning_list||[]),active=innings.find(i=>i.current_inning)||innings[0];if(!active?.inning_id)throw Error('No current innings ID found');const page=p.get('page')||'1',data=await getJson(`https://www.cricbay.com/server/api/livescore/inning/oversummary/details/${encodeURIComponent(active.inning_id)}/?page=${encodeURIComponent(page)}`);render(active,data)}catch(e){$('status').textContent='RETRY';$('error').textContent=`CricBay data unavailable: ${e.message}. Browser CORS restrictions may require hosting this page or adding a small proxy.`;$('error').style.display='block';console.error(e)}}update();setInterval(update,refresh)})();
</script></body></html>
